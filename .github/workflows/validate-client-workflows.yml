name: Validate client workflows

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Client workflow validation
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Install Chromium for security checks
        run: npx playwright install --with-deps chromium

      - name: Verify Content Security Policy in Chromium
        run: npm run test:csp

      - name: Build frontend
        run: npm run build

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Type-check changed Edge Functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/submit-quote/index.ts
          deno check --node-modules-dir=auto supabase/functions/create-quote-upload-url/index.ts
          deno check --node-modules-dir=auto supabase/functions/submit-order/index.ts
          deno check --node-modules-dir=auto supabase/functions/admin-orders/index.ts
          deno check --node-modules-dir=auto supabase/functions/my-requests/index.ts
          deno check --node-modules-dir=auto supabase/functions/submit-discussion/index.ts
          deno check --node-modules-dir=auto supabase/functions/create-upload-url/index.ts
