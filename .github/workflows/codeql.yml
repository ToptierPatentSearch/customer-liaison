name: CodeQL security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "40 0 * * 5" # Friday 9:40 AM in Japan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze and publish code scanning results
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:javascript-typescript
